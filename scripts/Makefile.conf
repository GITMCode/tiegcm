# Empty conf file - mapped in Makefile.dirs
# This file is only used when compiling with MILE,
# a UofM-developed ionospheric electrodynamics library

# Electrodynamics specific compiler workarounds

# 1. Clear debug flags if DEBUG is not TRUE
ifneq ($(DEBUG),TRUE)
  DBGFLAGS := 
endif

# 2. Prevent cascade promotion of double precision to REAL(16)
#    We do this by replacing -fdefault-real-8 with -freal-4-real-8
FFLAGS := $(subst -fdefault-real-8,-freal-4-real-8,$(FFLAGS))

# 3. Re-evaluate Cflag3 so the above overrides take effect
Cflag3 = $(CFLAG) $(FFLAGS) $(OPTIM) $(DBGFLAGS)

# 4. srcIndices needs ModTimeConvert from ModExtras.F90; ModKind/ModIoUnit/ModErrors
#    are already provided by Electrodynamics — use its .mod files directly.
FFLAGS += -I$(IEDIR)/src
Cflag3 = $(CFLAG) $(FFLAGS) $(OPTIM) $(DBGFLAGS)
PreProc = -DNEEDMODTIMECONVERT

.F90.o:
	$(COMPILE.f90) $(PreProc) $(Cflag3) $<

# 5. (re-)Define clean since ext libs do not place compiled files into build/
clean:
	rm -f *.o *.mod Makefile.DEPEND ${MYLIB}
